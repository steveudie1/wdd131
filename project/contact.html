<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopEaseHub - Product Review & Support">
    <meta name="author" content="Stephen Udie">
    <title>ShopEaseHub | Product Review</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/contact.css">
    <link rel="stylesheet" href="styles/main.css">

    <!-- Scripts -->
    <script src="scripts/nav.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo">ShopEaseHub</div>
            <input type="search" class="search-bar" placeholder="Search product..." aria-label="Search products">
            
            <div class="user-actions">
                <a href="#cart" class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</a>
                <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-label="Toggle Navigation Menu">&#9776;</button>
            </div>
        </div>
        <nav>
            <ul id="main-nav-list" class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Deals & Discounts</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="contact.html" class="active">Support</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Full Page Hero Container with Overlay Form -->
        <section class="hero">
            <!-- Full Page Background Picture -->
            <picture class="hero-bg">
                <source srcset="images/blender.webp" media="(max-width: 600px)" />
                <source srcset="images/headset.webp" media="(max-width: 1200px)" />
                <img src="images/shoe.webp" alt="Background Image of Blender" />
            </picture>

            <!-- Floating Form Card on Left Side -->
            <div class="form-card">
                <h2>Product Review</h2>
                <form method="get" action="thanks.html">
                    <fieldset>
                        <legend>Product Details</legend>
                        
                        <div class="form-group">
                            <label for="product-select">Product Name *</label>
                            <select id="product-select" name="product-name" required>
                                <option value="" disabled selected>Select a Product ...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Overall Rating *</label>
                            <div class="rating-group">
                                <div class="rating-option">
                                    <label for="star1">☆</label>
                                    <input type="radio" id="star1" name="rating" value="1" required>
                                </div>
                                <div class="rating-option">
                                    <label for="star2">☆☆</label>
                                    <input type="radio" id="star2" name="rating" value="2" required>
                                </div>
                                <div class="rating-option">
                                    <label for="star3">☆☆☆</label>
                                    <input type="radio" id="star3" name="rating" value="3" required>
                                </div>
                                <div class="rating-option">
                                    <label for="star4">☆☆☆☆</label>
                                    <input type="radio" id="star4" name="rating" value="4" required>
                                </div>
                                <div class="rating-option">
                                    <label for="star5">☆☆☆☆☆</label>
                                    <input type="radio" id="star5" name="rating" value="5" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="install-date">Date of Purchase/Installation *</label>
                            <input type="date" id="install-date" name="install-date" required>
                        </div>

                        <div class="form-group">
                            <label>Useful Features <br><span class="sub-text">(Check all that apply)</span></label>
                            <div class="checkbox-group">
                                <div class="checkbox-option">
                                    <input type="checkbox" id="durability" name="features" value="durability">
                                    <label for="durability">Durability</label>
                                </div>
                                <div class="checkbox-option">
                                    <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                                    <label for="ease-of-use">Ease of Use</label>
                                </div>
                                <div class="checkbox-option">
                                    <input type="checkbox" id="performance" name="features" value="performance">
                                    <label for="performance">Performance</label>
                                </div>
                                <div class="checkbox-option">
                                    <input type="checkbox" id="design" name="features" value="design">
                                    <label for="design">Design</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="review">Written Review <span class="optional">(Optional)</span></label>
                            <textarea id="review" name="review" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="username">Your Name <span class="optional">(Optional)</span></label>
                            <input type="text" id="username" name="username">
                        </div>

                        <button type="submit" class="submit-btn">Post Review</button>
                    </fieldset>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p> <span id="currentYear"></span> ShopEaseHub | Stephen Udie | Cross River, Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
