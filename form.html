<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    
</head>
<body>

    <div class="container">
        <header>
            <h1>Product Review</h1>
        </header>

        <form method="get" action="review.html">
            <fieldset>
            <!-- Product Name -->
            <div>
                <label for="product-select">Product Name</label>
                <select id="product-select" name="product-name" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                </select>
            </div>
            </fieldset>

            <!-- Overall Rating -->
            <div>
                <label>Overall Rating</label>
                <div class="rating-group">
                    <div class="rating-option">
                        <span>☆</span>
                        <input type="radio" id="star1" name="rating" value="1" required>
                    </div>
                    <div class="rating-option">
                        <span>☆☆</span>
                        <input type="radio" id="star2" name="rating" value="2">
                    </div>
                    <div class="rating-option">
                        <span>☆☆☆</span>
                        <input type="radio" id="star3" name="rating" value="3">
                    </div>
                    <div class="rating-option">
                        <span>☆☆☆☆</span>
                        <input type="radio" id="star4" name="rating" value="4">
                    </div>
                    <div class="rating-option">
                        <span>☆☆☆☆☆</span>
                        <input type="radio" id="star5" name="rating" value="5">
                    </div>
                </div>
            </div>

            <!-- Date of Installation -->
            <div>
                <label for="install-date">Date of Installation</label>
                <input type="date" id="install-date" name="install-date" required>
            </div>

            <!-- Useful Features -->
            <div>
                <label>Which features did you find useful in the product?<br><span class="sub-text">(Check all that apply)</span></label>
                <div class="checkbox-group">
                    <div class="checkbox-option">
                        <input type="checkbox" id="durability" name="features" value="durability">
                        <label for="durability">Durability</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                        <label for="ease-of-use">Ease of Use</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="performance" name="features" value="performance">
                        <label for="performance">Performance</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="design" name="features" value="design">
                        <label for="design">Design</label>
                    </div>
                </div>
            </div>

            
            <div>
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review"></textarea>
            </div>

            
            <div>
                <label for="username">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="username" name="username">
            </div>

            
            <input type="submit" value="Post Review" class="submit-btn">
        </form>

        <footer>
            <p>©2026 🌸 Udie Stephen Udie 🌸</p>
            <p>Nigeria</p>
            <p id="lastModified">Last Modification: 02/26/2024 13:56:10</p>
        </footer>
    </div>

    
</body>
</html>
